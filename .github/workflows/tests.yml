name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Formatting and static analysis are properties of the code, not of the
  # dependency graph, so they run once on the newest supported combination.
  # In the matrix they produced noise rather than signal: `prefer-lowest`
  # installs the oldest allowed Pint, which formats differently, and a PHPStan
  # baseline only matches the framework version it was generated against.
  quality:
    name: Quality · PHP 8.5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - run: composer lint -- --test
      - run: composer analyse

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependency-version: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} · ${{ matrix.dependency-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - run: composer test

      # Worth doing per cell rather than once: prefer-lowest can resolve to a
      # version that has since been found vulnerable.
      - name: Audit dependencies
        run: composer audit
